<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WunnaGo - Discover</title>
<style>
  :root{
    --cream: #FBF3D6;
    --cream-deep: #F5EAC0;
    --navy: #1F3A5F;
    --navy-deep: #16283F;
    --gold: #C79A2E;
    --gold-soft: #E8C468;
    --ink: #2B2B2B;
    --white: #FFFFFF;
    --star: #E0A526;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: var(--cream);
    color: var(--ink);
    display:flex;
    justify-content:center;
    min-height:100vh;
  }
  .phone{
    width:100%;
    max-width:420px;
    min-height:100vh;
    background: var(--cream);
    display:flex;
    flex-direction:column;
    position:relative;
  }

  /* header */
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 20px 10px;
  }
  .menu-icon{
    display:flex; flex-direction:column; gap:4px; cursor:pointer;
  }
  .menu-icon span{width:22px; height:2px; background:var(--navy); display:block;}
  .logo{
    font-size:1.4rem;
    font-weight:800;
    color:var(--navy);
    display:flex;
    align-items:baseline;
    gap:1px;
    position:relative;
  }
  .logo .go{color:var(--gold);}
  .avatar{
    width:34px; height:34px; border-radius:50%;
    background:var(--navy);
    display:flex; align-items:center; justify-content:center;
  }
  .avatar svg{width:18px; height:18px; fill:var(--cream);}

  /* card stack */
  .stack{
    flex:1;
    padding:6px 16px 12px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .card-wrap{
    position:relative;
    width:100%;
    max-width:360px;
  }
  .card{
    background:var(--white);
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 10px 24px rgba(31,58,95,0.16);
  }
  .media{
    position:relative;
    height:220px;
    background:#333 center/cover no-repeat;
  }
  .placeholder-media{
    background: linear-gradient(135deg, var(--navy) 0%, var(--navy-deep) 100%);
    display:flex; align-items:center; justify-content:center;
  }
  .placeholder-media .placeholder-label{
    color: var(--gold-soft);
    font-size:0.85rem;
    font-weight:600;
    text-transform:capitalize;
    letter-spacing:0.03em;
  }
  .price-note{
    font-size:0.8rem;
    font-weight:600;
    color:#6b6b6b;
    text-transform:none;
    max-width:110px;
    text-align:right;
  }
  .media .loc-tag{
    position:absolute; top:10px; left:10px;
    background:rgba(255,255,255,0.9);
    color:var(--navy);
    font-size:0.72rem;
    font-weight:600;
    padding:5px 9px;
    border-radius:20px;
    display:flex; align-items:center; gap:4px;
  }
  .media .save-tag{
    position:absolute; top:10px; right:10px;
    width:30px; height:30px;
    background:rgba(255,255,255,0.9);
    border-radius:8px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .media .play{
    position:absolute; top:50%; left:50%;
    transform:translate(-50%,-50%);
    width:56px; height:56px;
    border-radius:50%;
    border:2.5px solid var(--gold-soft);
    background:rgba(0,0,0,0.15);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .media .play svg{width:20px; height:20px; fill:var(--gold-soft); margin-left:3px;}

  .match-badge{
    display:inline-block;
    margin:12px 16px 0;
    background:var(--gold-soft);
    color:var(--navy-deep);
    font-size:0.7rem;
    font-weight:700;
    padding:4px 10px;
    border-radius:6px;
  }
  .card-body{padding:8px 16px 18px;}
  .title-row{
    display:flex; justify-content:space-between; align-items:baseline;
    margin-top:6px;
  }
  .title-row h2{font-size:1.08rem; color:var(--navy-deep); font-weight:700;}
  .price{font-weight:700; color:var(--navy); font-size:1rem;}
  .meta-line{
    font-size:0.85rem; color:#6b6b6b; margin-top:2px;
  }
  .host-row{
    display:flex; align-items:center; gap:8px;
    margin-top:12px;
  }
  .host-avatar{
    width:26px; height:26px; border-radius:50%;
    background:var(--navy); color:var(--cream);
    display:flex; align-items:center; justify-content:center;
    font-size:0.75rem; font-weight:700;
  }
  .host-name{font-weight:600; font-size:0.9rem;}
  .rating{font-size:0.82rem; color:#555; display:flex; align-items:center; gap:3px;}
  .rating .star{color:var(--star);}
  .quote{
    margin-top:10px;
    font-size:0.85rem;
    color:#4a4a4a;
    line-height:1.4;
    font-style:italic;
  }
  .quote .who{font-style:normal; font-weight:600; color:var(--ink);}
  .book-btn{
    margin-top:14px;
    width:100%;
    background:var(--navy);
    color:var(--cream);
    border:none;
    padding:12px;
    border-radius:10px;
    font-size:0.92rem;
    font-weight:600;
    cursor:pointer;
  }
  .book-btn:active{background:var(--navy-deep);}

  .nav-arrows{
    display:flex; justify-content:space-between;
    position:absolute; top:44%; left:-6px; right:-6px;
    pointer-events:none;
  }
  .nav-arrows button{
    pointer-events:all;
    width:34px; height:34px;
    border-radius:50%;
    border:none;
    background:rgba(255,255,255,0.85);
    box-shadow:0 2px 8px rgba(0,0,0,0.12);
    font-size:1rem;
    color:var(--navy);
    cursor:pointer;
  }
  .dots{
    display:flex; justify-content:center; gap:6px; margin-top:14px;
  }
  .dots span{
    width:6px; height:6px; border-radius:50%;
    background:#d8cba0;
  }
  .dots span.active{background:var(--navy);}

  .status-line{
    text-align:center; font-size:0.75rem; color:#8a8262; margin-top:6px;
  }

  /* bottom nav */
  .bottom-nav{
    display:flex; justify-content:space-around; align-items:center;
    padding:14px 0 20px;
    background:var(--white);
    border-top:1px solid #eee6c8;
  }
  .bottom-nav .item{
    width:40px; height:40px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
  }
  .bottom-nav .item.active{background:var(--navy);}
  .bottom-nav svg{width:18px; height:18px;}
  .bottom-nav .item.active svg{fill:var(--cream);}
  .bottom-nav .item:not(.active) svg{fill:none; stroke:var(--navy); stroke-width:1.8;}
</style>
</head>
<body>
<div class="phone">

  <header>
    <div class="menu-icon"><span></span><span></span><span></span></div>
    <div class="logo">Wunna<span class="go">Go</span></div>
    <div class="avatar">
      <svg viewBox="0 0 24 24"><path d="M12 12a5 5 0 100-10 5 5 0 000 10zm0 2c-4.4 0-8 2.2-8 5v1h16v-1c0-2.8-3.6-5-8-5z"/></svg>
    </div>
  </header>

  <div class="stack">
    <div class="card-wrap">
      <div class="nav-arrows">
        <button onclick="prevCard()">&#8249;</button>
        <button onclick="nextCard()">&#8250;</button>
      </div>

      <div class="card" id="card">
        <!-- filled by JS -->
      </div>
    </div>

    <div class="dots" id="dots"></div>
    <div class="status-line" id="status"></div>
  </div>

  <nav class="bottom-nav">
    <div class="item active">
      <svg viewBox="0 0 24 24"><path d="M12 2 2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
    </div>
    <div class="item">
      <svg viewBox="0 0 24 24"><path d="M21 11.5a8.5 8.5 0 01-8.5 8.5c-1.4 0-2.7-.3-3.9-.9L3 20l1-4.6A8.5 8.5 0 1121 11.5z"/></svg>
    </div>
    <div class="item">
      <svg viewBox="0 0 24 24"><path d="M6 4h12v18l-6-4-6 4V4z"/></svg>
    </div>
  </nav>
</div>

<script>
const API_BASE = "http://127.0.0.1:8000";

// Sample listings - shown until real host listings exist via /api/generate-listing.

const SAMPLE_LISTINGS = [
  {
    title: "make fishcakes with Gloria",
    host_name: "Gloria",
    location: "St. Thomas",
    price: "$15",
    duration_minutes: 30,
    description: "30 mins helping Gloria, then eat them hot",
    rating: 4.8,
    reviews: 40,
    match_tag: "matches food and drink",
    quote: "\u201cGloria was such a sweetheart and a great teacher. My fishcakes were delicious, I'm definitely going to make this when I go back home. This was such an authentic exp\u2026\u201d",
    quote_from: "Mr. Beast",
    image: "https://images.unsplash.com/photo-1604908176997-125f25cc6f3d?w=500&q=80"
  },
  {
    title: "check the pots at 6am with Anderson",
    host_name: "Anderson",
    location: "Skeete's Bay",
    price: "$20",
    duration_minutes: 90,
    description: "watch, help pull them in, learn the trade",
    rating: 4.9,
    reviews: 22,
    match_tag: "matches fishing and sea",
    quote: "\u201cWoke up early for this and it was worth every minute. Anderson knows every rock in that bay.\u201d",
    quote_from: "Priya R.",
    image: "https://images.unsplash.com/photo-1544551763-46a013bb70d5?w=500&q=80"
  },
  {
    title: "build a mahogany stool with Kemar",
    host_name: "Kemar",
    location: "St. Thomas",
    price: "$25",
    duration_minutes: 60,
    description: "hands-on woodworking, take home a small piece",
    rating: 5.0,
    reviews: 11,
    match_tag: "matches craft and making",
    quote: "\u201cI didn't expect to leave with something I actually made myself. Kemar is patient and funny.\u201d",
    quote_from: "Tom H.",
    image: "https://images.unsplash.com/photo-1601058268499-e52658b8bb88?w=500&q=80"
  }
];

let listings = SAMPLE_LISTINGS;
let current = 0;

function initials(name){
  if(!name) return "?";
  return name.split(" ").map(w=>w[0]).join("").toUpperCase().slice(0,2);
}

// Soft, on-brand placeholder used whenever a listing has no photo yet —
// avoids a broken image icon for real host listings (no upload flow built yet).
function placeholderMedia(hostType){
  const label = hostType ? hostType.replace(/_/g," ") : "experience";
  return `
    <div class="media placeholder-media">
      <span class="placeholder-label">${label}</span>
    </div>
  `;
}

function mediaBlock(l){
  const loc = l.location || (l.location_type ? l.location_type.replace(/_/g," ") : "Barbados");
  if(l.image){
    return `
      <div class="media" style="background-image:url('${l.image}')">
        <div class="loc-tag">📍 ${loc}</div>
        <div class="save-tag">🔖</div>
        <div class="play" onclick="alert('Video preview would play here.')">
          <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </div>
      </div>
    `;
  }
  // No photo/video yet - real host listings won't have one until upload is built.
  return `
    <div class="media placeholder-media">
      <div class="loc-tag">📍 ${loc}</div>
      <div class="save-tag">🔖</div>
      <span class="placeholder-label">${(l.host_type || "experience").replace(/_/g," ")}</span>
    </div>
  `;
}

function priceBlock(l){
  // Real listings carry fee_note ("ask host", "no set fee, donations welcome", etc.)
  // Sample listings carry a fixed price string. Show whichever exists.
  if(l.price) return `<span class="price">${l.price}</span>`;
  if(l.fee_note) return `<span class="price price-note">${l.fee_note}</span>`;
  return "";
}

function ratingInline(l){
  // Goes inside the flex host-row — safe to be empty.
  return l.rating ? `<span class="rating"><span class="star">★</span> ${l.rating}</span>` : "";
}

function quoteBlock(l){
  // Block-level, must sit OUTSIDE the flex host-row or it breaks the layout.
  // Only shown when a real review quote exists.
  if(!l.quote) return "";
  return `<div class="quote">${l.quote}<br><span class="who">— ${l.quote_from || "a visitor"}</span></div>`;
}

function badgeBlock(l){
  // match_tag exists on sample data; real listings use host_type instead.
  const label = l.match_tag || (l.host_type ? l.host_type.replace(/_/g," ") : "");
  if(!label) return "";
  return `<div class="match-badge">${label}</div>`;
}

function metaLine(l){
  const duration = l.duration_minutes ? `${l.duration_minutes} mins` : "";
  const desc = l.description || "";
  return [duration, desc].filter(Boolean).join(" &middot; ");
}

function renderCard(){
  const l = listings[current];
  const card = document.getElementById("card");
  card.innerHTML = `
    ${mediaBlock(l)}
    ${badgeBlock(l)}
    <div class="card-body">
      <div class="title-row">
        <h2>${l.title}</h2>
        ${priceBlock(l)}
      </div>
      <div class="meta-line">${metaLine(l)}</div>
      <div class="host-row">
        <div class="host-avatar">${initials(l.host_name)}</div>
        <span class="host-name">${l.host_name || "Host"}</span>
        ${ratingInline(l)}
      </div>
      ${quoteBlock(l)}
      <button class="book-btn" onclick="window.location.href='booking.html?title=' + encodeURIComponent('${l.title}')">Book this experience</button>
    </div>
  `;
  renderDots();
}

function renderDots(){
  const dots = document.getElementById("dots");
  dots.innerHTML = listings.map((_,i)=>
    `<span class="${i===current?'active':''}"></span>`
  ).join("");
}

function nextCard(){
  current = (current+1) % listings.length;
  renderCard();
}
function prevCard(){
  current = (current-1+listings.length) % listings.length;
  renderCard();
}

// loading real listings from backend.
async function loadListings(){
  const status = document.getElementById("status");
  try{
    const res = await fetch(`${API_BASE}/api/listings`);
    if(!res.ok) throw new Error("no endpoint yet");
    const data = await res.json();
    if(Array.isArray(data) && data.length){
      listings = data;
      status.textContent = "";
    } else {
      status.textContent = "Showing sample listings — no hosts saved yet.";
    }
  } catch(e){
    status.textContent = "Showing sample listings (backend /api/listings not connected yet).";
  }
  renderCard();
}

loadListings();
</script>
</body>
</html>
