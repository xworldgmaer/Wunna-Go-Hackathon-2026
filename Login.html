<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WunnaGo - Log In</title>
<style>
  :root{
    --cream: #FBF3D6; --cream-deep: #F5EAC0;
    --navy: #1F3A5F; --navy-deep: #16283F;
    --gold: #C79A2E; --gold-soft: #E8C468;
    --ink: #2B2B2B; --white: #FFFFFF;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: var(--cream); color: var(--ink);
    display:flex; justify-content:center; min-height:100vh;
  }
  .phone{width:100%; max-width:420px; min-height:100vh; background:var(--cream); padding:20px 24px 40px;}

  .lang-row{display:flex; justify-content:flex-end; margin-bottom:22px;}
  .lang-row select{
    appearance:none; -webkit-appearance:none; -moz-appearance:none;
    border:none;
    background:linear-gradient(135deg, var(--gold-soft) 0%, var(--gold) 100%);
    color:var(--navy-deep);
    font-family:inherit;
    font-size:0.82rem;
    font-weight:700;
    padding:9px 34px 9px 16px;
    border-radius:20px;
    cursor:pointer;
    box-shadow:0 3px 10px rgba(199,154,46,0.4);
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2316283F'><path d='M7 10l5 5 5-5z'/></svg>");
    background-repeat:no-repeat;
    background-position:right 10px center;
    background-size:16px;
    transition:transform 0.15s ease, box-shadow 0.15s ease;
  }
  .lang-row select:hover{
    transform:translateY(-1px);
    box-shadow:0 5px 14px rgba(199,154,46,0.55);
  }
  .lang-row select:focus{
    outline:2px solid var(--navy);
    outline-offset:2px;
  }

  .logo-img{height:52px; display:block; margin:0 auto 34px;}

  .section-label{text-align:center; font-size:0.86rem; color:#777; margin-bottom:14px;}

  .role-row{display:flex; gap:12px; margin-bottom:26px;}
  .role-card{
    flex:1; border:2px solid var(--cream-deep); border-radius:14px;
    background:var(--white); padding:18px 12px; text-align:center;
    cursor:pointer; position:relative;
  }
  .role-card.selected{border-color:var(--gold); background:#fffaf0;}
  .role-check{
    display:none; position:absolute; top:8px; right:8px;
    width:18px; height:18px; border-radius:50%;
    background:var(--gold); color:var(--white);
    font-size:0.7rem; align-items:center; justify-content:center;
  }
  .role-card.selected .role-check{display:flex;}
  .role-icon{font-size:1.5rem; margin-bottom:8px;}
  .role-title{font-weight:700; font-size:0.92rem; color:var(--navy-deep); margin-bottom:4px;}
  .role-sub{font-size:0.72rem; color:#888; line-height:1.3;}

  label{display:block; font-size:0.82rem; font-weight:600; color:var(--navy-deep); margin-bottom:6px; margin-top:16px;}
  input[type="email"], input[type="password"]{
    width:100%; border:1.5px solid var(--cream-deep); background:var(--white);
    padding:11px 14px; border-radius:10px; font-size:0.9rem;
  }
  input:focus{outline:none; border-color:var(--gold);}

  .login-btn{
    width:100%; margin-top:24px; background:var(--navy); color:var(--cream);
    border:none; padding:14px; border-radius:10px; font-size:0.95rem;
    font-weight:700; cursor:pointer;
  }
  .prototype-note{
    text-align:center; font-size:0.72rem; color:#999; margin-top:10px; line-height:1.4;
  }
  .links{text-align:center; margin-top:18px;}
  .links a{display:block; font-size:0.82rem; color:var(--navy); text-decoration:underline; margin-top:8px; cursor:pointer;}
</style>
</head>
<body>
<div class="phone">
  <div class="lang-row">
    <select id="langSelect" onchange="setLanguage(this.value)">
      <option value="en">🇬🇧 English</option>
      <option value="es">🇪🇸 Español</option>
      <option value="fr">🇫🇷 Français</option>
      <option value="pt">🇧🇷 Português</option>
    </select>
  </div>
  <img src="logo.png" alt="WunnaGo" class="logo-img">
  <div class="section-label" data-i18n="loginAs">Log in as...</div>

  <div class="role-row">
    <div class="role-card selected" id="visitorCard" onclick="selectRole('visitor')">
      <div class="role-check">✓</div>
      <div class="role-icon">🧭</div>
      <div class="role-title" data-i18n="visitor">Visitor</div>
      <div class="role-sub" data-i18n="visitorSub">Explore and find new experiences</div>
    </div>
    <div class="role-card" id="hostCard" onclick="selectRole('host')">
      <div class="role-check">✓</div>
      <div class="role-icon">🏠</div>
      <div class="role-title" data-i18n="host">Host</div>
      <div class="role-sub" data-i18n="hostSub">Share your experiences and culture</div>
    </div>
  </div>

  <label for="email" data-i18n="emailLabel">Email Address</label>
  <input type="email" id="email" placeholder="user@wunnago.com">

  <label for="password" data-i18n="passwordLabel">Password</label>
  <input type="password" id="password" placeholder="••••••••••••">

  <button class="login-btn" onclick="handleLogin()" data-i18n="loginBtn">LOGIN</button>
  <div class="prototype-note" data-i18n="prototypeNote">Prototype any email/password logs you in. No real accounts exist yet.</div>

  <div class="links">
    <a href="#" data-i18n="signUp">New here? Sign up</a>
    <a href="#" data-i18n="forgotPw">Forgot Password?</a>
  </div>
</div>

<script>
let selectedRole = "visitor";

// Static UI chrome — a lookup table, not an AI call. Fixed labels like these
// don't change per-request, so translating them via the model would be the
// "decorative AI" trap: a spreadsheet does this job correctly and honestly.
// Dynamic content (host bios, chat) uses /api/translate on the backend instead.
const TRANSLATIONS = {
  en: {
    loginAs: "Log in as...", visitor: "Visitor", visitorSub: "Explore and find new experiences",
    host: "Host", hostSub: "Share your experiences and culture",
    emailLabel: "Email Address", passwordLabel: "Password", loginBtn: "LOGIN",
    prototypeNote: "Prototype — any email/password logs you in. No real accounts exist yet.",
    signUp: "New here? Sign up", forgotPw: "Forgot Password?"
  },
  es: {
    loginAs: "Iniciar sesión como...", visitor: "Visitante", visitorSub: "Explora y descubre nuevas experiencias",
    host: "Anfitrión", hostSub: "Comparte tus experiencias y tu cultura",
    emailLabel: "Correo electrónico", passwordLabel: "Contraseña", loginBtn: "INICIAR SESIÓN",
    prototypeNote: "Prototipo — cualquier correo/contraseña funciona. Aún no existen cuentas reales.",
    signUp: "¿Nuevo aquí? Regístrate", forgotPw: "¿Olvidaste tu contraseña?"
  },
  fr: {
    loginAs: "Se connecter en tant que...", visitor: "Visiteur", visitorSub: "Explorez et découvrez de nouvelles expériences",
    host: "Hôte", hostSub: "Partagez vos expériences et votre culture",
    emailLabel: "Adresse e-mail", passwordLabel: "Mot de passe", loginBtn: "SE CONNECTER",
    prototypeNote: "Prototype — tout e-mail/mot de passe fonctionne. Aucun compte réel n'existe encore.",
    signUp: "Nouveau ici ? Inscrivez-vous", forgotPw: "Mot de passe oublié ?"
  },
  pt: {
    loginAs: "Entrar como...", visitor: "Visitante", visitorSub: "Explore e descubra novas experiências",
    host: "Anfitrião", hostSub: "Compartilhe suas experiências e sua cultura",
    emailLabel: "Endereço de e-mail", passwordLabel: "Senha", loginBtn: "ENTRAR",
    prototypeNote: "Protótipo — qualquer e-mail/senha funciona. Ainda não existem contas reais.",
    signUp: "Novo por aqui? Cadastre-se", forgotPw: "Esqueceu a senha?"
  }
};

function setLanguage(lang){
  const dict = TRANSLATIONS[lang] || TRANSLATIONS.en;
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const key = el.getAttribute("data-i18n");
    if(dict[key]) el.textContent = dict[key];
  });
  document.documentElement.lang = lang;
}

function selectRole(role){
  selectedRole = role;
  document.getElementById("visitorCard").classList.toggle("selected", role === "visitor");
  document.getElementById("hostCard").classList.toggle("selected", role === "host");
}

function handleLogin(){
  // Prototype: no real auth check — routes based on the role picked.
  if(selectedRole === "visitor"){
    window.location.href = "interests.html";
  } else {
    window.location.href = "verify-host-identity.html";
  }
}
</script>
</body>
</html>
